name: Component or feature request
description: Suggest a new component, a variant, or an improvement to the docs site.
title: "[Request]: "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The component or behavior, and where you'd use it.
    validations:
      required: true
  - type: textarea
    id: interaction
    attributes:
      label: Interaction and accessibility
      description: How it should respond to pointer, keyboard and reduced motion.
  - type: textarea
    id: references
    attributes:
      label: References
      description: Sketches, recordings or descriptions. Please don't paste code copied from other libraries.
