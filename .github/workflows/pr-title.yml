name: PR title

# Pull requests are squash-merged, so the title becomes the commit message on main.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            The summary "{subject}" should start with a lower-case letter and not end with a period,
            for example "feat(dock): add vertical orientation".
